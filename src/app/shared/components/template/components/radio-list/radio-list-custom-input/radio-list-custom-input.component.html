<ion-textarea
  class="option-custom-input"
  fill="outline"
  mode="md"
  [attr.aria-label]="placeholder() || 'Custom answer'"
  [placeholder]="placeholder()"
  [value]="value()"
  auto-grow="true"
  [rows]="1"
  (ionInput)="handleInput($event.detail.value)"
  (ionBlur)="handleBlur()"
  (ionChange)="$event.stopPropagation()"
  (mousedown)="$event.stopPropagation()"
  (click)="$event.stopPropagation()"
></ion-textarea>
