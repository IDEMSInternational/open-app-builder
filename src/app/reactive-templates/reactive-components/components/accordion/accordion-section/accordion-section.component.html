<ion-accordion
  [value]="name()"
  [attr.data-test]="name()"
  [disabled]="disabled()"
  [style.z-index]="zIndex()"
  [class.first-section]="sectionIndex() <= 0"
>
  <ion-item slot="header" class="accordion-header clear" lines="none">
    <ion-label class="accordion-section-title ion-text-wrap">
      {{ title() }}
    </ion-label>
    @if (icon().rotates) {
      <ion-icon class="ion-accordion-toggle-icon" [name]="icon().name" slot="end"></ion-icon>
    } @else {
      <!-- Ionic adds its own icon unless the header has an element with this class -->
      <div class="ion-accordion-toggle-icon"></div>
      <ion-icon [name]="icon().name" slot="end"></ion-icon>
    }
  </ion-item>

  <!-- Accordion section Content -->
  <ion-item slot="content" class="accordion-content clear" lines="none">
    <oab-row-list [namespace]="namespace()" [rows]="row().rows ?? []"></oab-row-list>
  </ion-item>
</ion-accordion>
