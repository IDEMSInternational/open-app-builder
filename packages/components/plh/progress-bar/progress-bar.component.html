<div class="progress-bar-wrapper">
  @if (params().title) {
    <plh-tmpl-text class="progress-title" [row]="titleRow()"></plh-tmpl-text>
  }
  <div class="progress-bar-background">
    <div
      class="progress-bar"
      [style.width.%]="displayProgress()"
      [style.background-color]="accentColor()"
    ></div>
  </div>
</div>
