    "fullscreen",
    "gdrive",
    "glitchtip",
    "gradlew",
    "gsutil",
    "idems",
    "ionicons",
    "iphonesimulator",
    "libexec",
    "linenums",
    "lottie",
    "matomo",
    "memfs",
    "metabase",
    "mkdocs",
    "mycompany",
    "nocheck",
    "ngcontent",
    "Nouislider",
    "overidden",
    "packagemanager",
    "quickstart",
    "rxdb",
    "sidemenu",
    "simctl",
    "sourcemaps",
    "supabase",
    "swiper",
    "templatename",
    "tmpl",
    "udid",
    "venv",
    "viewbox",
    "xcodebuild",
    "xcrun",
    "xcworkspace",
    "youtu",
    "youtube",
